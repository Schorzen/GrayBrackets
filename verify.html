<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify a Certificate · GrayBrackets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body style="background:var(--sand)">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html"><img src="logo.svg" width="32" height="32" alt=""> GrayBrackets</a>
      <nav class="nav" aria-label="Main">
        <a href="index.html#courses">Courses</a>
        <a href="verify.html" aria-current="page">Verify</a>
        <a data-auth-link href="account.html">Log in</a>
        <a class="btn btn-dark btn-small" href="lesson-1.html">Start learning free</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap" style="padding-top:44px;padding-bottom:64px;display:flex;flex-direction:column;gap:24px">
    <div>
      <p class="muted" style="font-size:14px">Certificate verification</p>
      <h1 id="result-title" style="font-size:clamp(30px,5vw,40px)">Check a certificate</h1>
    </div>

    <div class="verify-layout">
      <div class="verify-main">
        <div id="result" aria-live="polite"></div>
      </div>

      <aside class="verify-side">
        <form class="panel" id="verify-form">
          <label for="cert-id" style="font-weight:600">Enter a certificate ID</label>
          <input id="cert-id" type="text" placeholder="e.g. GB-HC-2026-ABC123" autocapitalize="characters" autocomplete="off">
          <button type="submit" class="btn btn-dark">Check certificate</button>
          <p class="muted" style="font-size:14px">The ID is printed on the certificate, next to the QR code.</p>
        </form>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>© <span class="year">2026</span> GrayBrackets. All rights reserved.</div>
      <nav aria-label="Footer"><a href="index.html">Home</a><a href="certificate.html">Sample certificate</a></nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
  (function () {
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeUrl = u => /^https:\/\//i.test(u || '') ? esc(u) : '#';
    const day = d => new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    const result = document.getElementById('result');
    const title = document.getElementById('result-title');
    const input = document.getElementById('cert-id');
    let seq = 0;

    async function show(id) {
      const mine = ++seq;
      id = (id || '').trim().toUpperCase();
      if (!id) {
        title.textContent = 'Check a certificate';
        result.innerHTML = '<div class="panel"><p>Enter a certificate ID to confirm it was issued by GrayBrackets. Every real certificate has its own ID and verification link.</p></div>';
        return;
      }
      title.textContent = 'Checking…';
      result.innerHTML = '';
      const { client } = await window.gbAuth.ready;
      if (!client) { title.textContent = 'Check a certificate'; result.innerHTML = '<div class="panel"><p>Verification is not available right now. Please try again later.</p></div>'; return; }
      const { data, error } = await client.rpc('verify_certificate', { p_id: id });
      if (mine !== seq) return;
      if (error) {
        title.textContent = 'Could not check';
        result.innerHTML = '<div class="status bad">Something went wrong. Check your connection and try again.</div>';
        return;
      }
      const c = data && data[0];
      if (!c) {
        title.textContent = 'Certificate not found';
        result.innerHTML = `<div class="status bad"><strong>Not verified.</strong>&nbsp;No GrayBrackets certificate has the ID ${esc(id)}. Check for typos, or the certificate may be fake.</div>`;
        return;
      }
      const initials = c.full_name.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const url = location.origin + location.pathname + '?id=' + encodeURIComponent(c.id);
      const pct = Math.round(c.score / c.total * 100);
      const skills = Array.isArray(c.skills) ? c.skills : [];
      const issued = new Date(c.issued_at);
      title.textContent = 'This certificate is valid';
      result.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:20px">
          <div class="status ok"><strong>Verified.</strong>&nbsp;Issued by GrayBrackets after passing the final exam and a reviewed capstone project.</div>
          <section class="panel">
            <div class="person"><div class="avatar" aria-hidden="true">${esc(initials)}</div>
              <div><div class="name">${esc(c.full_name)}</div><div class="muted">${esc(c.course_name)}</div></div></div>
            <dl class="facts" style="margin:0">
              <div><dt>Certificate ID</dt><dd><code>${esc(c.id)}</code></dd></div>
              <div><dt>Date issued</dt><dd>${esc(day(c.issued_at))}</dd></div>
              <div><dt>Final exam score</dt><dd>${pct}% <span class="muted" style="font-weight:400">(${c.score} of ${c.total}; passing: 80%)</span></dd></div>
              <div><dt>Status</dt><dd>Active, does not expire</dd></div>
            </dl>
            ${skills.length ? `<div><p class="muted" style="font-size:13px;margin-bottom:8px">Skills covered</p>
              <div class="chips">${skills.map(s => `<span>${esc(s)}</span>`).join('')}</div></div>` : ''}
            <div style="border-top:1px solid var(--line);padding-top:18px">
              <p class="muted" style="font-size:13px">Capstone project</p>
              <p style="display:flex;gap:18px;flex-wrap:wrap"><a href="${safeUrl(c.live_url)}" target="_blank" rel="noopener noreferrer">View live site</a><a href="${safeUrl(c.code_url)}" target="_blank" rel="noopener noreferrer">View code on GitHub</a></p>
            </div>
            <div class="btn-row">
              <a class="btn btn-dark btn-small" href="https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME&name=${encodeURIComponent(c.course_name)}&organizationName=GrayBrackets&issueYear=${issued.getFullYear()}&issueMonth=${issued.getMonth() + 1}&certId=${encodeURIComponent(c.id)}&certUrl=${encodeURIComponent(url)}" target="_blank" rel="noopener">Add to LinkedIn</a>
              <a class="btn btn-outline btn-small" href="certificate.html?id=${encodeURIComponent(c.id)}">View certificate</a>
              <button type="button" class="btn btn-outline btn-small" id="copy-link">Copy verification link</button>
            </div>
          </section>
        </div>`;
      document.getElementById('copy-link').addEventListener('click', e => {
        navigator.clipboard?.writeText(url).then(() => { e.target.textContent = 'Link copied'; }).catch(() => {});
      });
    }

    document.getElementById('verify-form').addEventListener('submit', e => {
      e.preventDefault();
      const id = input.value.trim().toUpperCase();
      history.replaceState(null, '', id ? '?id=' + encodeURIComponent(id) : location.pathname);
      show(id);
    });

    const startId = new URLSearchParams(location.search).get('id');
    if (startId) input.value = startId;
    show(startId);
    document.querySelectorAll('.year').forEach(e => e.textContent = new Date().getFullYear());
  })();
  </script>
</body>
</html>
