<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Final Exam · HTML &amp; CSS Foundations · GrayBrackets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <script>document.documentElement.classList.add('gb-checking')</script>
</head>
<body class="lesson-page" data-requires-login="true">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html"><img src="logo.svg" width="28" height="28" alt=""> GrayBrackets</a>
      <a data-auth-link href="account.html" style="font-weight:500;font-size:15px;color:var(--ink);padding:12px 4px">My account</a>
    </div>
  </header>

  <div class="lesson-layout" style="max-width:820px">
    <main id="main" class="lesson-main">
      <div class="panel">
        <p class="muted" style="font-size:14px">HTML &amp; CSS Foundations</p>
        <h1>Final exam</h1>
        <p id="status-text">Loading…</p>
        <p id="message" class="feedback" role="status" hidden></p>
        <div class="btn-row" id="intro-actions" hidden>
          <button type="button" class="btn btn-dark" id="start">Start the exam</button>
          <a class="btn btn-outline" href="final.html">Back</a>
        </div>
      </div>

      <form id="exam-form" class="panel" hidden novalidate>
        <div id="questions"></div>
        <p id="unanswered" class="feedback bad" role="status" hidden></p>
        <div><button type="submit" class="btn btn-accent">Submit answers</button></div>
      </form>

      <section id="result" class="panel" hidden aria-live="polite"></section>
    </main>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <div>© <span class="year">2026</span> GrayBrackets. All rights reserved.</div>
      <nav aria-label="Footer"><a href="index.html">Home</a><a href="final.html">Final project</a></nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
  (async function () {
    const COURSE = 'html-css';
    const LESSON_TITLES = ['What is a website?', 'Your first HTML file', 'Headings and paragraphs', 'Links and images', 'Lists and tables', 'Intro to CSS'];
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const msg = (text, ok) => { const m = $('message'); m.hidden = !text; m.textContent = text || ''; m.className = 'feedback ' + (ok ? 'ok' : 'bad'); };
    const ERRORS = {
      finish_lessons: 'Finish all 6 lessons first. A lesson counts as finished when you get every quiz question right.',
      cooldown: 'Please wait 15 minutes after a try before taking the exam again. Use the time to review the lessons.',
      not_logged_in: 'Please log in again to take the exam.'
    };
    const explain = e => ERRORS[(e && e.message || '').trim()] || ('Something went wrong. Details: ' + ((e && (e.message || e.code)) || 'no connection') + (e && e.hint ? ' (' + e.hint + ')' : ''));

    const { client, user, configured } = await window.gbAuth.ready;
    if (!configured || !client || !user) { $('status-text').textContent = 'Log in to take the exam.'; return; }

    function showPassed(a) {
      $('status-text').innerHTML = `You passed with <strong>${a.score} of ${a.total}</strong>. Next, submit your final project to get your certificate.`;
      $('intro-actions').hidden = false;
      $('start').hidden = true;
    }

    // Look at past attempts
    let last = null, passed = null;
    try {
      const { data } = await client.from('exam_attempts').select('score,total,passed,created_at').eq('course', COURSE).order('created_at', { ascending: false }).limit(20);
      last = data && data[0];
      passed = (data || []).find(a => a.passed);
    } catch (e) {}

    if (passed) { showPassed(passed); return; }
    $('status-text').textContent = '20 multiple-choice questions on all 6 lessons. You need 16 correct (80%) to pass. There is no time limit, and you can retake it 15 minutes after a try.';
    if (last) {
      const wait = 15 - Math.floor((Date.now() - new Date(last.created_at).getTime()) / 60000);
      $('status-text').textContent += ` Your last score was ${last.score} of ${last.total}.` + (wait > 0 ? ` You can try again in about ${wait} minute${wait === 1 ? '' : 's'}.` : '');
    }
    $('intro-actions').hidden = false;

    $('start').addEventListener('click', async () => {
      msg('');
      $('start').disabled = true;
      const { data, error } = await client.rpc('get_exam', { p_course: COURSE });
      $('start').disabled = false;
      if (error) { msg(explain(error), false); return; }
      $('questions').innerHTML = data.map((q, i) => `
        <fieldset data-qid="${q.id}">
          <legend>${i + 1}. ${esc(q.question)}</legend>
          ${q.options.map(o => `<label class="choice"><input type="radio" name="q${q.id}" value="${esc(o.v)}"> ${esc(o.t)}</label>`).join('')}
        </fieldset>`).join('');
      $('intro-actions').hidden = true;
      $('exam-form').hidden = false;
      $('exam-form').querySelector('legend').scrollIntoView({ behavior: 'smooth' });
    });

    $('exam-form').addEventListener('submit', async e => {
      e.preventDefault();
      const answers = {};
      let missing = [];
      [...document.querySelectorAll('#questions fieldset')].forEach((fs, i) => {
        const picked = fs.querySelector('input:checked');
        if (picked) answers[fs.dataset.qid] = picked.value; else missing.push(i + 1);
      });
      if (missing.length) {
        const u = $('unanswered');
        u.hidden = false;
        u.textContent = `Answer every question first. Missing: ${missing.join(', ')}.`;
        return;
      }
      $('unanswered').hidden = true;
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      const { data, error } = await client.rpc('submit_exam', { p_course: COURSE, p_answers: answers });
      btn.disabled = false;
      if (error) { msg(explain(error), false); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

      $('exam-form').hidden = true;
      const r = $('result');
      r.hidden = false;
      if (data.passed) {
        r.innerHTML = `
          <div class="status ok"><strong>Ang galing! You passed.</strong></div>
          <p style="font-size:20px">Your score: <strong>${data.score} of ${data.total}</strong></p>
          <p>Next step: submit your final project to get your certificate.</p>
          <div class="btn-row"><a class="btn btn-dark" href="final.html">Go to the final project</a></div>`;
        $('status-text').textContent = '';
      } else {
        const review = (data.review_lessons || []).map(n => `<li><a href="lesson-${n}.html">Lesson ${n}: ${esc(LESSON_TITLES[n - 1] || '')}</a></li>`).join('');
        r.innerHTML = `
          <div class="status bad"><strong>Not yet.</strong>&nbsp;You need 16 correct to pass.</div>
          <p style="font-size:20px">Your score: <strong>${data.score} of ${data.total}</strong></p>
          <p>Review these lessons, then try again in 15 minutes:</p>
          <ul class="lesson-list">${review}</ul>`;
      }
      r.scrollIntoView({ behavior: 'smooth' });
    });
  })();
  document.querySelectorAll('.year').forEach(e => { e.textContent = new Date().getFullYear(); });
  </script>
</body>
</html>
